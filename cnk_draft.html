<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CNK — คิวเขียนแบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',sans-serif;background:#f4f2fa;color:#1a1a2e;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;}
  .topbar{background:#7c3aed;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(124,58,237,0.25);}
  .topbar .t{font-size:18px;font-weight:700;}
  .topbar .who{font-size:13px;opacity:0.9;}
  .logout{background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
  .login{padding:40px 24px;text-align:center;}
  .login h1{font-size:22px;color:#6d28d9;margin-bottom:6px;}
  .login p{font-size:14px;color:#888;margin-bottom:28px;}
  .pin-display{font-size:34px;letter-spacing:14px;height:50px;color:#7c3aed;font-weight:700;margin-bottom:6px;min-height:50px;}
  .pin-msg{font-size:13px;color:#e74c3c;min-height:20px;margin-bottom:16px;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto;}
  .key{background:#fff;border:none;border-radius:16px;padding:20px 0;font-size:26px;font-weight:600;color:#1a1a2e;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.06);font-family:inherit;transition:transform .05s;}
  .key:active{transform:scale(0.94);background:#ede9fe;}
  .key.fn{font-size:16px;color:#7c3aed;font-weight:700;}
  .list{padding:14px;}
  .empty{text-align:center;color:#aaa;padding:60px 20px;font-size:15px;}
  .count{font-size:13px;color:#888;padding:2px 4px 12px;}
  /* compact card */
  .card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.06);border-left:4px solid #7c3aed;display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .05s;}
  .card:active{transform:scale(0.985);background:#faf9fe;}
  .card .body{flex:1;min-width:0;}
  .card .cust{font-size:16px;font-weight:700;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .job{font-size:13px;color:#666;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .badges{display:flex;gap:5px;margin-top:6px;}
  .mini{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;}
  .mini.file{background:#ede9fe;color:#6d28d9;}
  .mini.instr{background:#fff7ed;color:#c2410c;}
  .card .chev{color:#c9c3dd;font-size:22px;flex-shrink:0;}
  .loading{text-align:center;color:#aaa;padding:60px 0;}
  .refresh{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  /* detail modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;display:none;align-items:flex-end;justify-content:center;}
  .modal.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:8px 20px 26px;animation:slideup .25s ease;}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:44px;height:5px;background:#e0ddec;border-radius:3px;margin:8px auto 14px;}
  .sheet .m-cust{font-size:20px;font-weight:700;color:#1a1a2e;}
  .sheet .m-job{font-size:15px;color:#555;margin-top:2px;margin-bottom:16px;}
  .sheet .m-sec-label{font-size:12px;font-weight:700;color:#999;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
  .filebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:14px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;}
  .nofile{color:#aaa;font-size:14px;background:#f7f6fb;border-radius:10px;padding:12px;text-align:center;}
  .instr-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;font-size:15px;color:#7c2d12;white-space:pre-wrap;line-height:1.5;}
  .instr-img{margin-top:10px;}
  .instr-img img{width:100%;border-radius:10px;border:1px solid #eee;}
  .m-meta{font-size:12px;color:#aaa;margin-top:18px;}
  .done-btn{width:100%;margin-top:20px;background:#16a34a;color:#fff;border:none;border-radius:12px;padding:15px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;}
  .done-btn:active{background:#15803d;}
  .done-btn:disabled{background:#bbb;}
  .close-x{background:none;border:none;font-size:15px;color:#999;cursor:pointer;padding:6px;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <h1>📐 คิวเขียนแบบ</h1>
    <p>ใส่รหัส PIN ของช่าง</p>
    <div id="pin-display" class="pin-display"></div>
    <div id="pin-msg" class="pin-msg"></div>
    <div class="keypad">
      <button class="key" onclick="pinPress('1')">1</button>
      <button class="key" onclick="pinPress('2')">2</button>
      <button class="key" onclick="pinPress('3')">3</button>
      <button class="key" onclick="pinPress('4')">4</button>
      <button class="key" onclick="pinPress('5')">5</button>
      <button class="key" onclick="pinPress('6')">6</button>
      <button class="key" onclick="pinPress('7')">7</button>
      <button class="key" onclick="pinPress('8')">8</button>
      <button class="key" onclick="pinPress('9')">9</button>
      <button class="key fn" onclick="pinClear()">ล้าง</button>
      <button class="key" onclick="pinPress('0')">0</button>
      <button class="key fn" onclick="pinBack()">⌫</button>
    </div>
  </div>

  <div id="app" style="display:none;">
    <div class="topbar">
      <div>
        <div class="t">📐 งานเขียนแบบ</div>
        <div class="who" id="who"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="refresh" onclick="loadQueue()" title="รีเฟรช">🔄</button>
        <button class="logout" onclick="logout()">ออก</button>
      </div>
    </div>
    <div id="list" class="list">
      <div class="loading">กำลังโหลด...</div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div id="detail" class="modal" onclick="if(event.target===this)closeJob()">
  <div class="sheet">
    <div class="grab"></div>
    <div style="display:flex;justify-content:flex-end;"><button class="close-x" onclick="closeJob()">✕ ปิด</button></div>
    <div id="d-cust" class="m-cust"></div>
    <div id="d-job" class="m-job"></div>
    <div class="m-sec-label">ไฟล์งาน</div>
    <div id="d-file"></div>
    <div id="d-instr-wrap"></div>
    <div id="d-meta" class="m-meta"></div>
    <button id="d-done" class="done-btn">✅ เขียนเสร็จแล้ว</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzFPMqVCZ783-LIyxbDjqxroE-VpP8gIVPYh7uTeTAoYReKKmnjdMz5C5lvI3_FMPgT/exec';
const DRAFT_TECHS = [
  {name:'ช่างเดี่ยว', pin:'3268'},
  {name:'ช่างโพด', pin:'4169'}
];
let currentTech = null;
let _pin = '';
let _jobs = [];

function h(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// เพิ่ม fl_attachment เพื่อบังคับให้ browser ดาวน์โหลดไฟล์ (ไม่งั้น PDF/DXF บางทีเปิดไม่ได้)
function dlUrl(url){
  if(!url) return '';
  return url.indexOf('/upload/') > -1 ? url.replace('/upload/','/upload/fl_attachment/') : url;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tto);
  window._tto = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function renderPin(){
  var d = document.getElementById('pin-display');
  d.textContent = _pin.replace(/./g,'●');
}
function pinPress(n){
  if(_pin.length >= 4) return;
  _pin += n;
  renderPin();
  document.getElementById('pin-msg').textContent = '';
  if(_pin.length === 4) setTimeout(tryLogin, 150);
}
function pinBack(){ _pin = _pin.slice(0,-1); renderPin(); }
function pinClear(){ _pin = ''; renderPin(); document.getElementById('pin-msg').textContent=''; }
function tryLogin(){
  var t = DRAFT_TECHS.find(function(x){ return x.pin === _pin; });
  if(!t){
    document.getElementById('pin-msg').textContent = 'รหัสไม่ถูกต้อง';
    _pin = ''; renderPin();
    return;
  }
  currentTech = t.name;
  try{ localStorage.setItem('cnk_draft_tech', currentTech); }catch(e){}
  showApp();
}
function showApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = currentTech;
  loadQueue();
}
function logout(){
  currentTech = null; _pin = ''; renderPin();
  try{ localStorage.removeItem('cnk_draft_tech'); }catch(e){}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('pin-msg').textContent = '';
}

function loadQueue(){
  var el = document.getElementById('list');
  el.innerHTML = '<div class="loading">กำลังโหลด...</div>';
  fetch(API+'?action=getAll&table=draft_queue')
    .then(function(r){ return r.text(); })
    .then(function(t){
      var rows;
      try{ rows = JSON.parse(t); }catch(e){ throw new Error('bad response'); }
      if(!Array.isArray(rows)) rows = [];
      _jobs = rows.filter(function(r){
        return r.tech === currentTech && (r.status||'queued') !== 'done';
      }).sort(function(a,b){ return (a.createdAt||'') < (b.createdAt||'') ? 1 : -1; });
      renderCards(_jobs);
    })
    .catch(function(e){
      el.innerHTML = '<div class="empty">โหลดไม่สำเร็จ<br><button class="tag" onclick="loadQueue()" style="margin-top:14px;">ลองใหม่</button></div>';
    });
}

function renderCards(list){
  var el = document.getElementById('list');
  if(!list.length){
    el.innerHTML = '<div class="empty">🎉 ไม่มีงานในคิว<br>ตอนนี้เคลียร์หมดแล้ว</div>';
    return;
  }
  var html = '<div class="count">มีงานในคิว '+list.length+' งาน · แตะการ์ดเพื่อดูรายละเอียด</div>';
  html += list.map(function(r){
    var badges = '';
    if(r.fileUrl) badges += '<span class="mini file">📎 มีไฟล์</span>';
    if(r.instrText || r.instrImgUrl) badges += '<span class="mini instr">📝 มีคำสั่ง</span>';
    return '<div class="card" onclick="openJob(\''+h(r.id)+'\')">'
      + '<div class="body">'
        + '<div class="cust">'+h(r.custName||'-')+'</div>'
        + '<div class="job">'+h(r.jobName||'(ไม่มีชื่องาน)')+'</div>'
        + (badges ? '<div class="badges">'+badges+'</div>' : '')
      + '</div>'
      + '<div class="chev">›</div>'
      + '</div>';
  }).join('');
  el.innerHTML = html;
}

function openJob(id){
  var r = _jobs.find(function(x){ return String(x.id)===String(id); });
  if(!r) return;
  document.getElementById('d-cust').textContent = r.custName || '-';
  document.getElementById('d-job').textContent = r.jobName || '(ไม่มีชื่องาน)';
  // file
  var fileEl = document.getElementById('d-file');
  if(r.fileUrl){
    fileEl.innerHTML = '<a class="filebtn" href="'+h(dlUrl(r.fileUrl))+'">⬇️ '+h(r.fileName||'ดาวน์โหลดไฟล์งาน')+'</a>'
      + '<a href="'+h(r.fileUrl)+'" target="_blank" style="display:block;text-align:center;margin-top:8px;color:#7c3aed;font-size:13px;text-decoration:none;">👁️ เปิดดูในแท็บใหม่</a>';
  } else {
    fileEl.innerHTML = '<div class="nofile">— ไม่มีไฟล์แนบ (รับไฟล์ทางไลน์) —</div>';
  }
  // instructions
  var iw = document.getElementById('d-instr-wrap');
  var ihtml = '';
  if(r.instrText) ihtml += '<div class="instr-box">'+h(r.instrText)+'</div>';
  if(r.instrImgUrl) ihtml += '<div class="instr-img"><a href="'+h(r.instrImgUrl)+'" target="_blank"><img src="'+h(r.instrImgUrl)+'" alt="คำสั่ง"></a></div>';
  iw.innerHTML = ihtml ? ('<div class="m-sec-label">คำสั่งพิเศษ</div>'+ihtml) : '';
  // meta
  var d = r.createdAt ? new Date(r.createdAt).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  document.getElementById('d-meta').textContent = 'รับงาน: '+d+(r.createdBy?(' · โดย '+r.createdBy):'');
  // done button
  var btn = document.getElementById('d-done');
  btn.disabled = false; btn.textContent = '✅ เขียนเสร็จแล้ว';
  btn.onclick = function(){ markDone(r.id, btn); };
  document.getElementById('detail').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeJob(){
  document.getElementById('detail').classList.remove('show');
  document.body.style.overflow = '';
}

function markDone(id, btn){
  if(!confirm('ยืนยันว่าเขียนแบบงานนี้เสร็จแล้ว?\nงานจะหายไปจากคิว')) return;
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  var data = { status:'done', doneAt:new Date().toISOString() };
  var url = API+'?_method=update&table=draft_queue&id='+encodeURIComponent(id)+'&data='+encodeURIComponent(JSON.stringify(data));
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(){
      toast('✅ ปิดงานเรียบร้อย');
      closeJob();
      loadQueue();
    })
    .catch(function(){
      toast('บันทึกไม่สำเร็จ ลองใหม่');
      btn.disabled = false; btn.textContent = '✅ เขียนเสร็จแล้ว';
    });
}

(function(){
  var saved = null;
  try{ saved = localStorage.getItem('cnk_draft_tech'); }catch(e){}
  if(saved && DRAFT_TECHS.some(function(x){ return x.name === saved; })){
    currentTech = saved;
    showApp();
  }
})();
</script>
</body>
</html>
